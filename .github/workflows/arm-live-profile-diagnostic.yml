name: ARM Live Profile Diagnostic

on:
  push:
    branches:
      - codex/arm-live-profile-diagnostics

permissions:
  contents: read

jobs:
  compare-profiles:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: brew install ffmpeg sdl2 nasm

      - name: Cache pinned Whisper model and fixture
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/whisper-live-readiness-model
            ${{ runner.temp }}/whisper-live-readiness-fixture
          key: whisper-live-model-${{ hashFiles('sbobino_desktop/crates/domain/src/whisper_live_model.json') }}-fixture-5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150

      - name: Build exact packaged Apple Silicon runtime once
        working-directory: sbobino_desktop
        run: ./scripts/package_macos_runtime_asset.sh "$RUNNER_TEMP/speech-runtime-macos-aarch64.zip"

      - name: Compare sustained live profiles
        working-directory: sbobino_desktop
        shell: bash
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/speech-runtime-macos-aarch64.zip" "$RUNNER_TEMP/speech"
          runtime="$RUNNER_TEMP/speech/runtime"
          model="$RUNNER_TEMP/whisper-live-readiness-model/ggml-tiny-q8_0.bin"
          fixture="$RUNNER_TEMP/whisper-live-readiness-fixture/speech.wav"
          mkdir -p "$(dirname "$model")" "$(dirname "$fixture")" "$RUNNER_TEMP/profile-proofs"

          model_url=$(python3 -c 'import json; print(json.load(open("crates/domain/src/whisper_live_model.json"))["url"])')
          model_sha=$(python3 -c 'import json; print(json.load(open("crates/domain/src/whisper_live_model.json"))["sha256"])')
          if [[ ! -f "$model" ]]; then curl --fail --location --retry 5 --retry-all-errors "$model_url" --output "$model"; fi
          printf '%s  %s\n' "$model_sha" "$model" | shasum -a 256 -c -

          fixture_sha=5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150
          if [[ ! -f "$fixture" ]]; then
            curl --fail --location --retry 5 --retry-all-errors \
              https://raw.githubusercontent.com/mudler/parakeet.cpp/9edf17c3ada66e0f881dcff155492867db7ac4cf/tests/fixtures/speech.wav \
              --output "$fixture"
          fi
          printf '%s  %s\n' "$fixture_sha" "$fixture" | shasum -a 256 -c -

          audio="$RUNNER_TEMP/profile-180s.wav"
          "$runtime/bin/ffmpeg" -hide_banner -loglevel error -y -stream_loop -1 -i "$fixture" \
            -t 180 -ar 16000 -ac 1 -c:a pcm_s16le "$audio"

          run_profile() {
            local name=$1 step=$2 length=$3 audio_ctx=$4
            local run_dir="$RUNNER_TEMP/profile-$name"
            mkdir -p "$run_dir"
            set +e
            PATH="$runtime/bin:$PATH" \
            DYLD_LIBRARY_PATH="$runtime/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
            DYLD_FALLBACK_LIBRARY_PATH="$runtime/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" \
            SBOBINO_WHISPER_TEST_STEP_MS="$step" \
            SBOBINO_WHISPER_TEST_LENGTH_MS="$length" \
            SBOBINO_WHISPER_TEST_AUDIO_CTX="$audio_ctx" \
            python3 scripts/run_whisper_live_replay.py \
              --binary "$runtime/bin/whisper-stream" --model "$model" --audio "$audio" \
              --fixture "$fixture" --report "$RUNNER_TEMP/profile-proofs/$name.json" \
              --run-dir "$run_dir" --device auto --platform macos-arm64
            local result=$?
            set -e
            echo "$name exit=$result"
          }

          run_profile context1024 1000 2000 1024
          run_profile shorter-window 1000 1600 0
          run_profile balanced 1100 1600 1024
          run_profile context768 1000 2000 768

          python3 - "$RUNNER_TEMP/profile-proofs" <<'PY'
          import json, pathlib, sys
          for path in sorted(pathlib.Path(sys.argv[1]).glob("*.json")):
              data = json.loads(path.read_text())
              print(path.stem, json.dumps({
                  "status": data.get("status"),
                  "profile": data.get("profile"),
                  "preflight": data.get("preflight"),
                  "first_preview": data.get("first_preview_seconds"),
                  "preview_p95": data.get("preview_latency_p95_seconds"),
                  "backlog_p95": data.get("backlog_p95_seconds"),
                  "missing": data.get("missing_segments"),
                  "duplicate": data.get("duplicate_segments"),
                  "dropped": data.get("dropped_samples"),
                  "captured_frames": data.get("captured_audio_frames"),
                  "saved_frames": data.get("saved_audio_frames"),
                  "failures": data.get("failures"),
              }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-live-profile-proofs
          path: ${{ runner.temp }}/profile-proofs/*.json
          if-no-files-found: error
          retention-days: 3
