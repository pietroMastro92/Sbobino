name: Promote Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing prerelease tag to promote
        required: true
        default: v2.0.30
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Validate versioned release notes
        working-directory: sbobino_desktop
        run: |
          if [[ "$TAG_NAME" != "v2.0.30" ]]; then
            echo "Promotion is locked to the v2.0.30 candidate; got $TAG_NAME" >&2
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          SBOBINO_RELEASE_PROFILE=standalone-dev ./scripts/check_release_versions.sh "$VERSION"
          ./scripts/check_release_notes.sh "$VERSION" "docs/release-notes/v${VERSION}.md"

      - name: Promote validated candidate
        working-directory: sbobino_desktop
        run: |
          VERSION="${TAG_NAME#v}"
          ./scripts/promote_candidate_release.sh "$VERSION" "$GITHUB_REPOSITORY"
