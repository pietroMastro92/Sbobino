name: Parakeet Progressive VM Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to test
        required: true
        default: codex/parakeet-progressive-segments
        type: string

permissions:
  contents: read

jobs:
  as-third:
    name: AS-THIRD progressive Parakeet smoke
    runs-on: [self-hosted, macOS, ARM64, apple-silicon, as-third]
    timeout-minutes: 90
    env:
      SBOBINO_RUNNER_MIN_FREE_GB: "8.0"
      SBOBINO_ASR_SAMPLE: parakeet_fixture
      SBOBINO_PARAKEET_FIXTURE: speech.wav
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Add VM toolchain paths
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Setup Rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain stable --profile minimal -y
          else
            rustup toolchain install stable --profile minimal --no-self-update
            rustup default stable
          fi
          toolchain_bin="$(dirname "$(rustup which rustc)")"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          cargo --version
          rustc --version

      - name: Validate AS-THIRD preflight
        working-directory: sbobino_desktop
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          ./scripts/preflight_self_hosted_runner.sh AS-THIRD "$GITHUB_REPOSITORY"

      - name: Install frontend dependencies
        working-directory: sbobino_desktop/apps/desktop
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          npm ci

      - name: Run targeted Rust tests
        working-directory: sbobino_desktop
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          cargo fmt --check
          cargo test -p sbobino-infrastructure --test parakeet_cpp_engine_tests
          cargo test -p sbobino-infrastructure --test whisper_stream_engine_tests
          cargo test -p sbobino-desktop parakeet_realtime
          cargo test -p sbobino-application --test transcription_service_tests

      - name: Run frontend tests and build
        working-directory: sbobino_desktop/apps/desktop
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          npm test
          npm run build

      - name: Run real Parakeet progressive file smoke
        working-directory: sbobino_desktop
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          export SBOBINO_PARAKEET_CLI="$HOME/Library/Application Support/com.sbobino.desktop/bin/parakeet-cli"
          export SBOBINO_PARAKEET_MODELS_DIR="$HOME/Library/Application Support/com.sbobino.desktop/parakeet-models"
          export SBOBINO_PARAKEET_MODEL="tdt-0.6b-v3-q4_k.gguf"
          mkdir -p "$SBOBINO_PARAKEET_MODELS_DIR"
          for model in "$SBOBINO_PARAKEET_MODEL" "nemotron-3.5-asr-streaming-0.6b-q4_k.gguf"; do
            if [[ ! -f "$SBOBINO_PARAKEET_MODELS_DIR/$model" ]]; then
              curl --fail --location --continue-at - \
                --output "$SBOBINO_PARAKEET_MODELS_DIR/$model" \
                "https://huggingface.co/mudler/parakeet-cpp-gguf/resolve/main/$model"
            fi
          done
          ./scripts/setup_parakeet_fixtures.sh
          ./scripts/smoke_parakeet_real.sh
