name: ARM Runtime Validation

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Candidate tag whose packaged runtime should be validated
        required: true
        default: v2.0.30
        type: string

permissions:
  contents: read

jobs:
  whisper-live-replay:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Validate v2.0.30 candidate tag and versioned notes
        working-directory: sbobino_desktop
        run: |
          if [[ "$TAG_NAME" != "v2.0.30" ]]; then
            echo "ARM validation is locked to the v2.0.30 candidate; got $TAG_NAME" >&2
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          SBOBINO_RELEASE_PROFILE=standalone-dev ./scripts/check_release_versions.sh "$VERSION"
          ./scripts/check_release_notes.sh "$VERSION" "docs/release-notes/v${VERSION}.md"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: brew install ffmpeg sdl2 nasm

      - name: Cache pinned Whisper live model and speech fixture
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/whisper-live-readiness-model
            ${{ runner.temp }}/whisper-live-readiness-fixture
          key: whisper-live-model-${{ hashFiles('sbobino_desktop/crates/domain/src/whisper_live_model.json') }}-fixture-5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150

      - name: Build the exact packaged Apple Silicon speech runtime
        working-directory: sbobino_desktop
        run: ./scripts/package_macos_runtime_asset.sh "$RUNNER_TEMP/speech-runtime-macos-aarch64.zip"

      - name: Replay packaged Whisper through the production stream binary
        working-directory: sbobino_desktop
        run: |
          SBOBINO_WHISPER_LIVE_ARCH=arm64 \
          SBOBINO_WHISPER_ALLOW_PREFLIGHT_REJECTION=1 \
          SBOBINO_WHISPER_LIVE_RUNTIME_ZIP="$RUNNER_TEMP/speech-runtime-macos-aarch64.zip" \
          SBOBINO_LIVE_RUNNER="github-hosted macos-15" \
          ./scripts/release_macos_whisper_live_smoke.sh \
            "${TAG_NAME#v}" "${GITHUB_REPOSITORY}" \
            "$RUNNER_TEMP/arm-whisper-live-smoke-proof.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-whisper-live-replay
          path: ${{ runner.temp }}/arm-whisper-live-smoke-proof.json
          if-no-files-found: error
          retention-days: 3
