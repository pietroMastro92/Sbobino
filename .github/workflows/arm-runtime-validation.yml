name: ARM Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whisper-live-replay:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: brew install ffmpeg sdl2 nasm

      - name: Cache pinned Whisper live model and speech fixture
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/whisper-live-readiness-model
            ${{ runner.temp }}/whisper-live-readiness-fixture
          key: whisper-live-model-${{ hashFiles('sbobino_desktop/crates/domain/src/whisper_live_model.json') }}-fixture-5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150

      - name: Build the exact packaged Apple Silicon speech runtime
        working-directory: sbobino_desktop
        run: ./scripts/package_macos_runtime_asset.sh "$RUNNER_TEMP/speech-runtime-macos-aarch64.zip"

      - name: Replay packaged Whisper through the production stream binary
        working-directory: sbobino_desktop
        run: |
          SBOBINO_WHISPER_LIVE_ARCH=arm64 \
          SBOBINO_WHISPER_LIVE_RUNTIME_ZIP="$RUNNER_TEMP/speech-runtime-macos-aarch64.zip" \
          SBOBINO_LIVE_RUNNER="github-hosted macos-14" \
          ./scripts/release_macos_whisper_live_smoke.sh \
            "source-validation" "${GITHUB_REPOSITORY}" \
            "$RUNNER_TEMP/arm-whisper-live-smoke-proof.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-whisper-live-replay
          path: ${{ runner.temp }}/arm-whisper-live-smoke-proof.json
          if-no-files-found: warn
          retention-days: 3
