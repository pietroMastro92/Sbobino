name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sbobino_desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Release/runtime contract tests
        run: |
          ./scripts/check_macos_runtime_source.sh
          bash ./scripts/check_windows_powershell_source.sh
          python3 -m unittest \
            scripts/test_release_workflow_contract.py \
            scripts/test_evaluate_live_latency.py \
            scripts/test_run_whisper_live_replay.py
      - name: Clippy
        run: cargo clippy -p sbobino-domain -p sbobino-application -p sbobino-infrastructure --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p sbobino-domain -p sbobino-application -p sbobino-infrastructure

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sbobino_desktop/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sbobino_desktop/apps/desktop/package-lock.json
      - name: Check version coherence
        run: ../../scripts/check_release_versions.sh
      - name: Install dependencies
        run: npm ci
      - name: Check skipped test declarations
        run: ../../scripts/check_no_skipped_tests.sh
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  windows-bootstrap:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: sbobino_desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sbobino_desktop/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release version wiring
        run: ./scripts/check_release_versions.sh
      - name: Bootstrap metadata smoke
        run: cargo metadata --manifest-path Cargo.toml --format-version 1 >/dev/null
