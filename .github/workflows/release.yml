name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing git tag to build and publish as a prerelease candidate
        required: true
        default: v2.0.31
        type: string

permissions:
  contents: write

jobs:
  validate-candidate:
    name: Validate v2.0.31 candidate tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
    steps:
      - name: Require the reviewed candidate tag
        run: |
          if [[ "$TAG_NAME" != "v2.0.31" ]]; then
            echo "Release Candidate is locked to v2.0.31; got $TAG_NAME" >&2
            exit 1
          fi

  build-native:
    name: Build native macOS ${{ matrix.arch }}
    needs: validate-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TAG_NAME: ${{ inputs.tag_name }}
    defaults:
      run:
        working-directory: sbobino_desktop/apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sbobino_desktop/apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Intel conda build environment
        if: matrix.arch == 'x86_64'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: false
          use-mamba: false

      - name: Install packaging dependencies
        # nasm is required by FFmpeg's native x86_64 assembly implementation.
        # It is a build-only tool: the packaged runtime remains self-contained.
        run: brew install whisper-cpp ffmpeg sdl2 nasm

      - name: Install frontend dependencies
        run: npm ci

      - name: Hydrate native Pyannote assets
        run: ../../scripts/setup_bundled_pyannote.sh --force

      - name: Validate macOS runtime source contracts
        run: ../../scripts/check_macos_runtime_source.sh

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: ../../scripts/prepare_release_updater_config.sh src-tauri/tauri.conf.json "$TAURI_UPDATER_PUBLIC_KEY"

      - name: Build, sign, and stage native artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for release candidates." >&2
            exit 1
          fi
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            CODESIGN_IDENTITY="-"
          else
            CODESIGN_IDENTITY="$APPLE_SIGNING_IDENTITY"
          fi

          npm run tauri:build -- --target "${{ matrix.target }}" --bundles app

          BUNDLE_DIR="../../target/${{ matrix.target }}/release/bundle"
          APP_DIR="$BUNDLE_DIR/macos"
          APP_PATH="$APP_DIR/Sbobino.app"
          UPDATER_TAR="$APP_DIR/Sbobino.app.tar.gz"
          UPDATER_SIG="$UPDATER_TAR.sig"
          STAGING_DIR="$RUNNER_TEMP/sbobino-${{ matrix.arch }}"
          mkdir -p "$STAGING_DIR"

          codesign --force --deep --sign "$CODESIGN_IDENTITY" "$APP_PATH"
          rm -f "$UPDATER_TAR" "$UPDATER_SIG"
          COPYFILE_DISABLE=1 tar -czf "$UPDATER_TAR" -C "$APP_DIR" "Sbobino.app"
          npx tauri signer sign "$UPDATER_TAR"

          DMG_STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Sbobino" -srcfolder "$DMG_STAGE" -ov -format UDZO \
            "$STAGING_DIR/Sbobino_${VERSION}_${{ matrix.arch }}.dmg"

          ../../scripts/package_macos_runtime_asset.sh \
            "$STAGING_DIR/speech-runtime-macos-${{ matrix.arch }}.zip"
          ../../scripts/package_pyannote_asset.sh \
            "src-tauri/resources/pyannote/python/${{ matrix.target }}" \
            python \
            "$STAGING_DIR/pyannote-runtime-macos-${{ matrix.arch }}.zip"
          ../../scripts/package_pyannote_asset.sh \
            "src-tauri/resources/pyannote/model" \
            model \
            "$STAGING_DIR/pyannote-model-community-1.zip"

          SBOBINO_RELEASE_TARGET_TRIPLE="${{ matrix.target }}" \
            ../../scripts/release_readiness.sh "$VERSION" "$APP_PATH"

          cp "$UPDATER_TAR" "$STAGING_DIR/Sbobino_${VERSION}_${{ matrix.arch }}.app.tar.gz"
          cp "$UPDATER_SIG" "$STAGING_DIR/Sbobino_${VERSION}_${{ matrix.arch }}.app.tar.gz.sig"

      - name: Notarize and staple native DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Apple notarization credentials are not configured; keeping the native DMG unsigned."
            exit 0
          fi
          VERSION="${TAG_NAME#v}"
          DMG="$RUNNER_TEMP/sbobino-${{ matrix.arch }}/Sbobino_${VERSION}_${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"

      - name: Upload native staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbobino-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/sbobino-${{ matrix.arch }}/*
          if-no-files-found: error

  build-windows:
    name: Build native Windows x86_64
    needs: validate-candidate
    runs-on: windows-2025
    env:
      TAG_NAME: ${{ inputs.tag_name }}
    defaults:
      run:
        working-directory: sbobino_desktop/apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sbobino_desktop/apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Windows PowerShell source contracts
        shell: bash
        run: bash ../../scripts/check_windows_powershell_source.sh

      - name: Build portable Windows speech runtime and sidecars
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows"
          New-Item -ItemType Directory -Force $staging | Out-Null
          ../../scripts/package_windows_runtime_asset.ps1 `
            -OutputZip (Join-Path $staging "speech-runtime-windows-x86_64.zip") `
            -SidecarDir (Join-Path $PWD "src-tauri\binaries")

      - name: Cache pinned Parakeet readiness model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parakeet-readiness-model
          key: parakeet-readiness-tdt-0.6b-v3-q4-k-993d73feb4206dadda865ab25bd64b50c48dc4d013c3bf6126a721f28b1d5ee8

      - name: Download pinned Parakeet readiness model
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:RUNNER_TEMP "parakeet-readiness-model"
          $model = Join-Path $modelRoot "tdt-0.6b-v3-q4_k.gguf"
          New-Item -ItemType Directory -Force $modelRoot | Out-Null
          $expected = "993d73feb4206dadda865ab25bd64b50c48dc4d013c3bf6126a721f28b1d5ee8"
          if (-not (Test-Path -PathType Leaf $model) -or
              (Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne $expected) {
            Invoke-WebRequest -Uri "https://huggingface.co/mudler/parakeet-cpp-gguf/resolve/bf0af9f425fa01809cadec671b3cb672709d13e9/tdt-0.6b-v3-q4_k.gguf?download=true" -OutFile $model
          }
          if ((Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne $expected) {
            throw "pinned Parakeet readiness model checksum mismatch"
          }

      - name: Compile all Windows Rust tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc --no-run
        working-directory: sbobino_desktop

      - name: Run portable Windows Rust tests
        # Infrastructure process-probe tests use intentional POSIX shell fixtures.
        # Compile that crate above, then validate its production binaries below
        # through readiness plus the installed NSIS application smoke.
        run: cargo test -p sbobino-domain -p sbobino-application -p sbobino-desktop --target x86_64-pc-windows-msvc -- --test-threads=1
        working-directory: sbobino_desktop

      - name: Verify Windows Credential Manager roundtrip
        run: cargo test -p sbobino-infrastructure --target x86_64-pc-windows-msvc secure_storage::tests::windows_credential_manager_roundtrip -- --exact
        working-directory: sbobino_desktop

      - name: Build Windows background-process smoke harness
        run: cargo build -p sbobino-infrastructure --bin windows_background_process_smoke --target x86_64-pc-windows-msvc --release
        working-directory: sbobino_desktop

      - name: Download offline Pyannote model
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "pyannote-community-1"
          git lfs install
          git clone --depth 1 https://huggingface.co/pyannote-community/speaker-diarization-community-1 $model
          git -C $model lfs pull
          if (-not (Test-Path (Join-Path $model "config.yaml"))) { throw "Pyannote model is incomplete" }

      - name: Build portable Windows Pyannote runtime
        shell: pwsh
        run: |
          ../../scripts/package_windows_pyannote_runtime.ps1 `
            -OutputZip (Join-Path $env:RUNNER_TEMP "sbobino-windows\pyannote-runtime-windows-x86_64.zip") `
            -ModelDir (Join-Path $env:RUNNER_TEMP "pyannote-community-1") `
            -FfmpegArchivePath (Join-Path $env:RUNNER_TEMP "sbobino-windows\speech-runtime-windows-x86_64.zip")

      - name: Inject updater public key
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: ../../scripts/prepare_release_updater_config.sh src-tauri/tauri.conf.json "$TAURI_UPDATER_PUBLIC_KEY"

      - name: Test native Windows app
        run: npm --prefix apps/desktop test -- --run --testTimeout 15000
        working-directory: sbobino_desktop

      - name: Build and stage NSIS installer and updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is required" }
          $version = $env:TAG_NAME.TrimStart("v")
          $env:SBOBINO_RELEASE_PROFILE = "public"
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
          $nsis = Join-Path $PWD "..\..\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows"
          $installer = @(Get-ChildItem $nsis -File -Filter "*-setup.exe")
          $updater = @(Get-ChildItem $nsis -File -Filter "*.nsis.zip")
          $signature = @(Get-ChildItem $nsis -File -Filter "*.nsis.zip.sig")
          if ($installer.Count -ne 1 -or $updater.Count -ne 1 -or $signature.Count -ne 1) {
            throw "unexpected NSIS artifact set in $nsis"
          }
          Copy-Item $installer[0].FullName (Join-Path $staging "Sbobino_${version}_windows_x86_64-setup.exe")
          Copy-Item $updater[0].FullName (Join-Path $staging "Sbobino_${version}_windows_x86_64.nsis.zip")
          Copy-Item $signature[0].FullName (Join-Path $staging "Sbobino_${version}_windows_x86_64.nsis.zip.sig")
          ../../scripts/windows_release_readiness.ps1 `
            -Version $version `
            -StagingDir $staging `
            -ParakeetModelPath (Join-Path $env:RUNNER_TEMP "parakeet-readiness-model\tdt-0.6b-v3-q4_k.gguf")

      - name: Smoke install opaque GUI without visible background consoles
        shell: pwsh
        run: |
          $version = $env:TAG_NAME.TrimStart("v")
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows"
          $installer = Join-Path $staging "Sbobino_${version}_windows_x86_64-setup.exe"
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)" }
          $app = Get-ChildItem $env:LOCALAPPDATA -Recurse -File -Filter "sbobino-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $app) { throw "installed sbobino-desktop.exe was not found" }
          $harness = Join-Path $PWD "..\..\target\x86_64-pc-windows-msvc\release\windows_background_process_smoke.exe"
          ../../scripts/windows_gui_smoke.ps1 `
            -AppPath $app.FullName `
            -HarnessPath $harness `
            -SpeechRuntimeZip (Join-Path $staging "speech-runtime-windows-x86_64.zip") `
            -PyannoteRuntimeZip (Join-Path $staging "pyannote-runtime-windows-x86_64.zip") `
            -ReportPath (Join-Path $env:RUNNER_TEMP "windows-gui-smoke-report.json")

      - uses: actions/upload-artifact@v4
        with:
          name: sbobino-windows-x86_64
          path: ${{ runner.temp }}/sbobino-windows/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui-smoke-harness
          path: sbobino_desktop/target/x86_64-pc-windows-msvc/release/windows_background_process_smoke.exe
          if-no-files-found: error

  publish-candidate:
    needs: [validate-candidate, build-native, build-windows]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Validate release version and notes
        working-directory: sbobino_desktop
        run: |
          VERSION="${TAG_NAME#v}"
          ./scripts/check_release_versions.sh "$VERSION"
          ./scripts/check_release_notes.sh "$VERSION" "docs/release-notes/v${VERSION}.md"

      - uses: actions/download-artifact@v4
        with:
          name: sbobino-macos-aarch64
          path: sbobino_desktop/dist/staging/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: sbobino-macos-x86_64
          path: sbobino_desktop/dist/staging/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: sbobino-windows-x86_64
          path: sbobino_desktop/dist/staging/windows-x86_64

      - name: Assemble and publish the dual-architecture candidate
        working-directory: sbobino_desktop
        run: |
          VERSION="${TAG_NAME#v}"
          OUTPUT_DIR="$PWD/dist/github-release/v$VERSION"
          SBOBINO_RELEASE_REPOSITORY="$GITHUB_REPOSITORY" \
          ./scripts/assemble_local_release.sh \
            "$VERSION" \
            "$PWD/dist/staging/aarch64" \
            "$PWD/dist/staging/x86_64" \
            "$PWD/dist/staging/windows-x86_64" \
            "$OUTPUT_DIR"
          ./scripts/publish_candidate_release.sh "$VERSION" "$GITHUB_REPOSITORY" "$OUTPUT_DIR"

  release-quality-contract-tests:
    name: Synthetic ASR/live contract tests (not release evidence)
    needs: publish-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate pinned fixtures as contract tests only
        working-directory: sbobino_desktop
        run: |
          python3 scripts/run_release_quality_gates.py \
            --output-dir "$RUNNER_TEMP/sbobino-release-quality"

      - name: Upload contract-test reports (never folded into proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-contract-tests
          path: ${{ runner.temp }}/sbobino-release-quality/*.json
          if-no-files-found: error
          retention-days: 3

  distribution-readiness:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            proof: distribution-readiness-proof.json
          - arch: x86_64
            runner: macos-15-intel
            proof: intel-distribution-readiness-proof.json
    runs-on: ${{ matrix.runner }}
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Cache pinned Whisper live model and speech fixture
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/whisper-live-readiness-model
            ${{ runner.temp }}/whisper-live-readiness-fixture
          key: whisper-live-model-${{ hashFiles('sbobino_desktop/crates/domain/src/whisper_live_model.json') }}-fixture-5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate public assets on the matching architecture
        working-directory: sbobino_desktop
        run: ./scripts/distribution_readiness.sh "${TAG_NAME#v}" "$GITHUB_REPOSITORY"

      - name: Run real packaged Whisper live replay on the matching architecture
        working-directory: sbobino_desktop
        run: |
          DEVICE=auto
          NATIVE_ARCH=arm64
          EXPECT_PREFLIGHT_REJECTION=0
          ALLOW_PREFLIGHT_REJECTION=1
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            NATIVE_ARCH=x86_64
            EXPECT_PREFLIGHT_REJECTION=1
            ALLOW_PREFLIGHT_REJECTION=0
          fi
          SBOBINO_WHISPER_LIVE_ARCH="$NATIVE_ARCH" \
          SBOBINO_WHISPER_LIVE_DEVICE="$DEVICE" \
          SBOBINO_WHISPER_EXPECT_PREFLIGHT_REJECTION="$EXPECT_PREFLIGHT_REJECTION" \
          SBOBINO_WHISPER_ALLOW_PREFLIGHT_REJECTION="$ALLOW_PREFLIGHT_REJECTION" \
          SBOBINO_LIVE_RUNNER="github-hosted ${{ matrix.runner }}" \
          ./scripts/release_macos_whisper_live_smoke.sh \
            "${TAG_NAME#v}" "$GITHUB_REPOSITORY" "$PWD/${{ matrix.arch }}-whisper-live-smoke-proof.json"

      - name: Write architecture proof
        working-directory: sbobino_desktop
        run: |
          python3 ./scripts/write_distribution_readiness_proof.py \
            "$PWD/${{ matrix.proof }}" \
            "${TAG_NAME#v}" \
            --repo-slug "$GITHUB_REPOSITORY" \
            --commit-sha "$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-readiness-${{ matrix.arch }}
          path: sbobino_desktop/${{ matrix.proof }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisper-live-${{ matrix.arch }}
          path: sbobino_desktop/${{ matrix.arch }}-whisper-live-smoke-proof.json
          if-no-files-found: error

  windows-distribution-readiness:
    needs: publish-candidate
    runs-on: windows-2025
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows-gui-smoke-harness
          path: ${{ runner.temp }}/windows-gui-smoke-harness

      - name: Cache pinned Parakeet readiness model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parakeet-readiness-model
          key: parakeet-readiness-tdt-0.6b-v3-q4-k-993d73feb4206dadda865ab25bd64b50c48dc4d013c3bf6126a721f28b1d5ee8

      - name: Download pinned Parakeet readiness model
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:RUNNER_TEMP "parakeet-readiness-model"
          $model = Join-Path $modelRoot "tdt-0.6b-v3-q4_k.gguf"
          New-Item -ItemType Directory -Force $modelRoot | Out-Null
          $expected = "993d73feb4206dadda865ab25bd64b50c48dc4d013c3bf6126a721f28b1d5ee8"
          if (-not (Test-Path -PathType Leaf $model) -or
              (Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne $expected) {
            Invoke-WebRequest -Uri "https://huggingface.co/mudler/parakeet-cpp-gguf/resolve/bf0af9f425fa01809cadec671b3cb672709d13e9/tdt-0.6b-v3-q4_k.gguf?download=true" -OutFile $model
          }
          if ((Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne $expected) {
            throw "pinned Parakeet readiness model checksum mismatch"
          }

      - name: Download and validate public Windows assets
        shell: pwsh
        working-directory: sbobino_desktop
        run: |
          $version = $env:TAG_NAME.TrimStart("v")
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows-public"
          New-Item -ItemType Directory -Force $staging | Out-Null
          gh release download $env:TAG_NAME --repo $env:GITHUB_REPOSITORY `
            --pattern "Sbobino_${version}_windows_x86_64*" `
            --pattern "speech-runtime-windows-x86_64.zip" `
            --pattern "pyannote-runtime-windows-x86_64.zip" `
            --dir $staging
          ./scripts/windows_release_readiness.ps1 `
            -Version $version `
            -StagingDir $staging `
            -ParakeetModelPath (Join-Path $env:RUNNER_TEMP "parakeet-readiness-model\tdt-0.6b-v3-q4_k.gguf")

          $installer = Join-Path $staging "Sbobino_${version}_windows_x86_64-setup.exe"
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)" }
          $app = Get-ChildItem $env:LOCALAPPDATA -Recurse -File -Filter "sbobino-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $app) { throw "installed sbobino-desktop.exe was not found" }
          $unexpectedSidecars = @(Get-ChildItem $app.Directory.FullName -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(ffmpeg|whisper|parakeet).+\.exe$' })
          if ($unexpectedSidecars.Count -gt 0) {
            throw "public Windows install contains unmanaged native sidecars: $($unexpectedSidecars.Name -join ', ')"
          }
          $guiReportPath = Join-Path $PWD "windows-gui-smoke-report.json"
          ./scripts/windows_gui_smoke.ps1 `
            -AppPath $app.FullName `
            -HarnessPath (Join-Path $env:RUNNER_TEMP "windows-gui-smoke-harness\windows_background_process_smoke.exe") `
            -SpeechRuntimeZip (Join-Path $staging "speech-runtime-windows-x86_64.zip") `
            -PyannoteRuntimeZip (Join-Path $staging "pyannote-runtime-windows-x86_64.zip") `
            -ReportPath $guiReportPath
          $guiReport = Get-Content $guiReportPath -Raw | ConvertFrom-Json
          $guiReport | Add-Member -Force version $version
          $guiReport | Add-Member -Force release_tag $env:TAG_NAME
          $guiReport | Add-Member -Force commit_sha (git rev-parse HEAD)
          $guiReport | Add-Member -Force repo_slug $env:GITHUB_REPOSITORY
          $guiReport | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $guiReportPath

          $liveReportPath = Join-Path $PWD "windows-whisper-live-smoke-proof.json"
          ./scripts/release_windows_whisper_live_smoke.ps1 `
            -Version $version `
            -RepoSlug $env:GITHUB_REPOSITORY `
            -ReportPath $liveReportPath `
            -RuntimeZip (Join-Path $staging "speech-runtime-windows-x86_64.zip") `
            -ExpectPreflightRejection
          $liveReport = Get-Content $liveReportPath -Raw | ConvertFrom-Json

          @{
            schema_version = 1
            version = $version
            release_tag = $env:TAG_NAME
            architecture = "x86_64"
            platform = "windows"
            status = "passed"
            runner = "github-hosted windows-2025"
            machine_class = "WINDOWS-HOSTED-CLEANROOM"
            tested_at_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            commit_sha = (git rev-parse HEAD)
            repo_slug = $env:GITHUB_REPOSITORY
            visible_console_windows = $guiReport.visible_console_windows
            main_window_count = $guiReport.main_window_count
            main_window_opaque = $guiReport.main_window_opaque
            macos_transparency_preserved = $guiReport.macos_transparency_preserved
            live_latency = $liveReport
          } | ConvertTo-Json -Depth 10 | Set-Content windows-distribution-readiness-proof.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-readiness-windows-x86_64
          path: |
            sbobino_desktop/windows-distribution-readiness-proof.json
            sbobino_desktop/windows-gui-smoke-report.json
          if-no-files-found: error

  portability-smoke:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            report: portability-smoke-report.json
          - arch: x86_64
            runner: macos-15-intel
            report: intel-portability-smoke-report.json
    runs-on: ${{ matrix.runner }}
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Bootstrap headless login keychain
        run: |
          KC="$HOME/Library/Keychains/login.keychain-db"
          if [[ ! -f "$KC" ]]; then security create-keychain -p "" "$KC"; fi
          security default-keychain -s "$KC"
          security unlock-keychain -p "" "$KC"
          security set-keychain-settings "$KC"

      - name: Download and install matching native DMG
        working-directory: sbobino_desktop
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p dist/portability
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Sbobino_${VERSION}_${{ matrix.arch }}.dmg" \
            --dir dist/portability
          MNT=$(mktemp -d)
          hdiutil attach "dist/portability/Sbobino_${VERSION}_${{ matrix.arch }}.dmg" -nobrowse -quiet -mountpoint "$MNT"
          sudo rm -rf /Applications/Sbobino.app
          /usr/bin/ditto "$MNT/Sbobino.app" /Applications/Sbobino.app
          hdiutil detach "$MNT" -quiet
          xattr -dr com.apple.quarantine /Applications/Sbobino.app || true

      - name: Launch app and confirm it remains alive
        working-directory: sbobino_desktop
        run: |
          /Applications/Sbobino.app/Contents/MacOS/sbobino-desktop >launch.log 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID" || true
            tail -80 launch.log >&2 || true
            exit 1
          fi
          kill "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

      - name: Write portability report
        if: always()
        working-directory: sbobino_desktop
        run: |
          STATUS=passed
          if [[ "${{ job.status }}" != "success" ]]; then STATUS=failed; fi
          cat >"${{ matrix.report }}" <<EOF
          {
            "schema_version": 1,
            "version": "${TAG_NAME#v}",
            "release_tag": "${TAG_NAME}",
            "architecture": "${{ matrix.arch }}",
            "status": "${STATUS}",
            "runner": "github-hosted ${{ matrix.runner }}",
            "machine_class": "HOSTED-CLEANROOM",
            "tested_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit_sha": "$(git rev-parse HEAD)",
            "repo_slug": "$GITHUB_REPOSITORY"
          }
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-smoke-${{ matrix.arch }}
          path: sbobino_desktop/${{ matrix.report }}
          if-no-files-found: error

  intel-pyannote-parakeet-smoke:
    needs: publish-candidate
    runs-on: macos-15-intel
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sbobino_desktop/apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned Parakeet readiness model
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/parakeet-readiness-model
            ${{ runner.temp }}/parakeet-readiness-fixture
          key: parakeet-readiness-tdt-0.6b-v3-q4-k-993d73feb4206dadda865ab25bd64b50c48dc4d013c3bf6126a721f28b1d5ee8-fixture-5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150

      - name: Run real Intel CPU Parakeet and Pyannote smoke
        working-directory: sbobino_desktop
        run: |
          VERSION="${TAG_NAME#v}"
          ./scripts/release_intel_pyannote_parakeet_smoke.sh \
            "$VERSION" "$GITHUB_REPOSITORY" "$PWD/intel-pyannote-parakeet-smoke-proof.json"

      - name: Require real ASR report from the packaged Intel engine
        working-directory: sbobino_desktop
        run: |
          # Intel certifies the packaged long-file engine and Pyannote. The
          # accelerated live replay is measured separately on macos-15 ARM64.
          # Never substitute the synthetic Ubuntu fixture reports here.
          python3 - "$PWD/intel-pyannote-parakeet-smoke-proof.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          proof = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("asr_reference",):
              report = proof.get(key)
              if not isinstance(report, dict):
                  raise SystemExit(
                      f"real hosted packaged-engine proof is missing {key}; "
                      "candidate remains unpromotable"
                  )
              if report.get("evidence_class") != "hosted-packaged-engine":
                  raise SystemExit(f"{key} is not hosted packaged-engine evidence")
              if report.get("real_engine") is not True or report.get("real_harness") is not True:
                  raise SystemExit(f"{key} did not execute the packaged engine and harness")
              if not str(report.get("runner") or "").startswith("github-hosted "):
                  raise SystemExit(f"{key} is not from a GitHub-hosted runner")
              if not str(report.get("harness") or "").strip():
                  raise SystemExit(f"{key} is missing harness identity")
              if not re.fullmatch(r"[0-9a-fA-F]{64}", str(report.get("input_audio_sha256") or "")):
                  raise SystemExit(f"{key} is missing a pinned input audio hash")
              runtime_hashes = report.get("runtime_artifact_sha256")
              if not isinstance(runtime_hashes, dict) or not runtime_hashes or any(
                  not re.fullmatch(r"[0-9a-fA-F]{64}", str(value))
                  for value in runtime_hashes.values()
              ):
                  raise SystemExit(f"{key} is missing packaged runtime hashes")
              if report.get("status") != "passed" or report.get("failures"):
                  raise SystemExit(f"{key} did not pass")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-pyannote-parakeet-smoke
          path: |
            sbobino_desktop/intel-pyannote-parakeet-smoke-proof.json
            sbobino_desktop/intel-pyannote-parakeet-smoke-logs/*.log
          if-no-files-found: error
          retention-days: 3

  upload-validation-assets:
    needs: [distribution-readiness, windows-distribution-readiness, portability-smoke, intel-pyannote-parakeet-smoke, release-quality-contract-tests]
    if: always()
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: distribution-readiness-aarch64
          path: validation-assets

      - uses: actions/download-artifact@v4
        with:
          name: distribution-readiness-x86_64
          path: validation-assets

      - uses: actions/download-artifact@v4
        with:
          name: whisper-live-aarch64
          path: validation-assets

      - uses: actions/download-artifact@v4
        with:
          name: whisper-live-x86_64
          path: validation-assets

      - uses: actions/download-artifact@v4
        with:
          name: distribution-readiness-windows-x86_64
          path: validation-assets

      - uses: actions/download-artifact@v4
        with:
          name: portability-smoke-aarch64
          path: validation-assets

      - uses: actions/download-artifact@v4
        with:
          name: portability-smoke-x86_64
          path: validation-assets

      - uses: actions/download-artifact@v4
        with:
          name: intel-pyannote-parakeet-smoke
          path: validation-assets

      - name: Stage the candidate readiness proof
        run: |
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "release-readiness-proof.json" \
            --dir validation-assets

      - name: Fold Intel CPU/Pyannote smoke into the Intel distribution proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          validation_dir = Path("validation-assets")
          arm_distribution_path = validation_dir / "distribution-readiness-proof.json"
          distribution_path = validation_dir / "intel-distribution-readiness-proof.json"
          smoke_path = validation_dir / "intel-pyannote-parakeet-smoke-proof.json"
          arm_live_path = validation_dir / "aarch64-whisper-live-smoke-proof.json"
          intel_live_path = validation_dir / "x86_64-whisper-live-smoke-proof.json"
          arm_distribution = json.loads(arm_distribution_path.read_text(encoding="utf-8"))
          distribution = json.loads(distribution_path.read_text(encoding="utf-8"))
          smoke = json.loads(smoke_path.read_text(encoding="utf-8"))
          arm_live = json.loads(arm_live_path.read_text(encoding="utf-8"))
          intel_live = json.loads(intel_live_path.read_text(encoding="utf-8"))
          expected_commit = distribution.get("commit_sha")
          expected_repo = distribution.get("repo_slug")
          for label, report in (
              ("ARM distribution", arm_distribution),
              ("Intel smoke", smoke),
          ):
              if report.get("commit_sha") != expected_commit or report.get("repo_slug") != expected_repo:
                  raise SystemExit(f"{label} revision/repository does not match the candidate")
          if smoke.get("version") != distribution.get("version"):
              raise SystemExit("Intel smoke version does not match Intel distribution proof")
          if smoke.get("release_tag") != distribution.get("release_tag"):
              raise SystemExit("Intel smoke release tag does not match Intel distribution proof")
          if smoke.get("status") != "passed":
              raise SystemExit("Intel CPU/Pyannote smoke did not pass")
          for key, report in (("asr_reference", smoke.get("asr_reference")),):
              if not isinstance(report, dict):
                  raise SystemExit(
                      f"Intel smoke is missing real hosted {key}; "
                      "synthetic contract fixtures cannot satisfy release evidence"
                  )
              if report.get("evidence_class") != "hosted-packaged-engine":
                  raise SystemExit(f"Intel smoke {key} is not hosted packaged-engine evidence")
              if report.get("real_engine") is not True or report.get("real_harness") is not True:
                  raise SystemExit(f"Intel smoke {key} did not execute a real engine/harness")
              if not str(report.get("runner") or "").startswith("github-hosted "):
                  raise SystemExit(f"Intel smoke {key} did not run on a hosted runner")
              if report.get("status") != "passed" or report.get("failures"):
                  raise SystemExit(f"Intel smoke {key} did not pass")
              if report.get("commit_sha") != expected_commit or report.get("repo_slug") != expected_repo:
                  raise SystemExit(f"Intel smoke {key} revision/repository mismatch")
              # The ASR report is real hosted evidence and belongs in the
              # existing ARM distribution proof so promotion has one stable
              # location to validate it. Synthetic Ubuntu reports never enter
              # this fold.
              arm_distribution[key] = report
          for label, report, expected_platform in (
              ("ARM live", arm_live, "macos-arm64"),
              ("Intel live", intel_live, "macos-x86_64"),
          ):
              if not isinstance(report, dict):
                  raise SystemExit(f"{label} proof is missing")
              if report.get("evidence_class") != "hosted-packaged-engine":
                  raise SystemExit(f"{label} is not hosted packaged-engine evidence")
              if report.get("real_engine") is not True or report.get("real_harness") is not True:
                  raise SystemExit(f"{label} did not execute a real engine/harness")
              if report.get("platform") != expected_platform:
                  raise SystemExit(f"{label} platform mismatch")
              if report.get("status") != "passed" or report.get("failures"):
                  raise SystemExit(f"{label} did not pass")
              if report.get("commit_sha") != expected_commit or report.get("repo_slug") != expected_repo:
                  raise SystemExit(f"{label} revision/repository mismatch")
          arm_distribution["live_latency"] = arm_live
          distribution["live_latency"] = intel_live
          distribution["intel_pyannote_parakeet_smoke"] = {
              "schema_version": smoke.get("schema_version"),
              "status": smoke.get("status"),
              "runner": smoke.get("runner"),
              "machine_class": smoke.get("machine_class"),
              "tested_at_utc": smoke.get("tested_at_utc"),
              "commit_sha": smoke.get("commit_sha"),
              "repo_slug": smoke.get("repo_slug"),
              "parakeet_duration_seconds": smoke.get("parakeet_duration_seconds"),
              "parakeet_compute_device": smoke.get("parakeet_compute_device"),
              "parakeet_language": smoke.get("parakeet_language"),
              "pyannote_deep_smoke": smoke.get("pyannote_deep_smoke"),
              "asr_reference": smoke.get("asr_reference"),
              "live_latency": intel_live,
              "logs": smoke.get("logs", []),
          }
          distribution_path.write_text(json.dumps(distribution, indent=2) + "\n", encoding="utf-8")
          arm_distribution_path.write_text(json.dumps(arm_distribution, indent=2) + "\n", encoding="utf-8")
          smoke_path.unlink()
          arm_live_path.unlink()
          intel_live_path.unlink()
          PY

      - name: Require exactly the public seven JSON proof assets
        run: |
          python3 sbobino_desktop/scripts/run_release_quality_gates.py \
            --validate-public-proof-assets validation-assets

      - name: Upload validation assets to the prerelease
        run: gh release upload "$TAG_NAME" validation-assets/*.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Fail when either native validation path failed
        run: |
          [[ "${{ needs.distribution-readiness.result }}" == "success" ]]
          [[ "${{ needs.windows-distribution-readiness.result }}" == "success" ]]
          [[ "${{ needs.portability-smoke.result }}" == "success" ]]
          [[ "${{ needs.intel-pyannote-parakeet-smoke.result }}" == "success" ]]
          [[ "${{ needs.release-quality-contract-tests.result }}" == "success" ]]
