name: Windows Port Validation

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Candidate tag whose Windows package should be validated
        required: true
        default: v2.0.30
        type: string
  push:
    branches:
      - codex/windows-port

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2025
    env:
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
    defaults:
      run:
        working-directory: sbobino_desktop/apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Validate v2.0.30 candidate tag and versioned notes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: sbobino_desktop
        run: |
          if [[ "$TAG_NAME" != "v2.0.30" ]]; then
            echo "Windows validation is locked to the v2.0.30 candidate; got $TAG_NAME" >&2
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          SBOBINO_RELEASE_PROFILE=standalone-dev ./scripts/check_release_versions.sh "$VERSION"
          ./scripts/check_release_notes.sh "$VERSION" "docs/release-notes/v${VERSION}.md"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sbobino_desktop/apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Windows PowerShell source contracts
        shell: bash
        run: bash ../../scripts/check_windows_powershell_source.sh

      - name: Build portable Windows speech runtime and Tauri sidecars
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows"
          New-Item -ItemType Directory -Force $staging | Out-Null
          ../../scripts/package_windows_runtime_asset.ps1 `
            -OutputZip (Join-Path $staging "speech-runtime-windows-x86_64.zip") `
            -SidecarDir (Join-Path $PWD "src-tauri\binaries")

      - name: Run real packaged Whisper live replay on Windows CPU
        shell: pwsh
        working-directory: sbobino_desktop
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows"
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          ./scripts/release_windows_whisper_live_smoke.ps1 `
            -Version $version `
            -RepoSlug $env:GITHUB_REPOSITORY `
            -ReportPath (Join-Path $staging "windows-whisper-live-smoke-proof.json") `
            -RuntimeZip (Join-Path $staging "speech-runtime-windows-x86_64.zip") `
            -ExpectPreflightRejection

      - name: Cache pinned Parakeet readiness model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parakeet-readiness-model
          key: parakeet-readiness-tdt-0.6b-v3-q4-k-993d73feb4206dadda865ab25bd64b50c48dc4d013c3bf6126a721f28b1d5ee8

      - name: Download pinned Parakeet readiness model
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:RUNNER_TEMP "parakeet-readiness-model"
          $model = Join-Path $modelRoot "tdt-0.6b-v3-q4_k.gguf"
          New-Item -ItemType Directory -Force $modelRoot | Out-Null
          $expected = "993d73feb4206dadda865ab25bd64b50c48dc4d013c3bf6126a721f28b1d5ee8"
          if (-not (Test-Path -PathType Leaf $model) -or
              (Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne $expected) {
            Invoke-WebRequest -Uri "https://huggingface.co/mudler/parakeet-cpp-gguf/resolve/bf0af9f425fa01809cadec671b3cb672709d13e9/tdt-0.6b-v3-q4_k.gguf?download=true" -OutFile $model
          }
          if ((Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne $expected) {
            throw "pinned Parakeet readiness model checksum mismatch"
          }

      - name: Compile all Windows Rust tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc --no-run
        working-directory: sbobino_desktop

      - name: Run portable Windows Rust tests
        # Infrastructure process-probe tests use intentional POSIX shell fixtures.
        # Compile that crate above, then validate its production binaries below
        # through readiness plus the installed NSIS application smoke.
        run: cargo test -p sbobino-domain -p sbobino-application -p sbobino-desktop --target x86_64-pc-windows-msvc -- --test-threads=1
        working-directory: sbobino_desktop

      - name: Verify Windows Credential Manager roundtrip
        run: cargo test -p sbobino-infrastructure --target x86_64-pc-windows-msvc secure_storage::tests::windows_credential_manager_roundtrip -- --exact
        working-directory: sbobino_desktop

      - name: Build Windows background-process smoke harness
        run: cargo build -p sbobino-infrastructure --bin windows_background_process_smoke --target x86_64-pc-windows-msvc --release
        working-directory: sbobino_desktop

      - name: Download offline Pyannote model
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "pyannote-community-1"
          git lfs install
          git clone --depth 1 https://huggingface.co/pyannote-community/speaker-diarization-community-1 $model
          git -C $model lfs pull
          if (-not (Test-Path (Join-Path $model "config.yaml"))) { throw "Pyannote model is incomplete" }

      - name: Build portable Windows Pyannote runtime
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows"
          ../../scripts/package_windows_pyannote_runtime.ps1 `
            -OutputZip (Join-Path $staging "pyannote-runtime-windows-x86_64.zip") `
            -ModelDir (Join-Path $env:RUNNER_TEMP "pyannote-community-1") `
            -FfmpegArchivePath (Join-Path $staging "speech-runtime-windows-x86_64.zip")

      - name: Inject updater public key
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: ../../scripts/prepare_release_updater_config.sh src-tauri/tauri.conf.json "$TAURI_UPDATER_PUBLIC_KEY"

      - name: Run frontend tests
        run: npm test -- --run --testTimeout 15000

      - name: Build native NSIS installer and updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is required" }
          $env:SBOBINO_RELEASE_PROFILE = "public"
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $nsis = Join-Path $PWD "..\..\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $staging = Join-Path $env:RUNNER_TEMP "sbobino-windows"
          $installer = @(Get-ChildItem $nsis -File -Filter "*-setup.exe")
          $updater = @(Get-ChildItem $nsis -File -Filter "*.nsis.zip")
          $signature = @(Get-ChildItem $nsis -File -Filter "*.nsis.zip.sig")
          if ($installer.Count -ne 1 -or $updater.Count -ne 1 -or $signature.Count -ne 1) {
            throw "unexpected NSIS artifact set in $nsis"
          }
          Copy-Item $installer[0].FullName (Join-Path $staging "Sbobino_${version}_windows_x86_64-setup.exe")
          Copy-Item $updater[0].FullName (Join-Path $staging "Sbobino_${version}_windows_x86_64.nsis.zip")
          Copy-Item $signature[0].FullName (Join-Path $staging "Sbobino_${version}_windows_x86_64.nsis.zip.sig")

      - name: Validate portable Windows distribution
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ../../scripts/windows_release_readiness.ps1 `
            -Version $version `
            -StagingDir (Join-Path $env:RUNNER_TEMP "sbobino-windows") `
            -ParakeetModelPath (Join-Path $env:RUNNER_TEMP "parakeet-readiness-model\tdt-0.6b-v3-q4_k.gguf")

      - name: Smoke install and launch NSIS package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Join-Path $env:RUNNER_TEMP "sbobino-windows\Sbobino_${version}_windows_x86_64-setup.exe"
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Sbobino\sbobino-desktop.exe"
          if (-not (Test-Path $app)) {
            $match = Get-ChildItem $env:LOCALAPPDATA -Recurse -File -Filter "sbobino-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $match) { throw "installed sbobino-desktop.exe was not found" }
            $app = $match.FullName
          }
          $appDirectory = Split-Path -Parent $app
          $unexpectedSidecars = @(Get-ChildItem $appDirectory -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(ffmpeg|whisper|parakeet).+\.exe$' })
          if ($unexpectedSidecars.Count -gt 0) {
            throw "public Windows install contains unmanaged native sidecars: $($unexpectedSidecars.Name -join ', ')"
          }
          $harness = Join-Path $PWD "..\..\target\x86_64-pc-windows-msvc\release\windows_background_process_smoke.exe"
          ../../scripts/windows_gui_smoke.ps1 `
            -AppPath $app `
            -HarnessPath $harness `
            -SpeechRuntimeZip (Join-Path $env:RUNNER_TEMP "sbobino-windows\speech-runtime-windows-x86_64.zip") `
            -PyannoteRuntimeZip (Join-Path $env:RUNNER_TEMP "sbobino-windows\pyannote-runtime-windows-x86_64.zip") `
            -ReportPath (Join-Path $env:RUNNER_TEMP "sbobino-windows\windows-gui-smoke-report.json")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbobino-windows-x86_64
          path: ${{ runner.temp }}/sbobino-windows/*
          if-no-files-found: error
