[package]
name = "sbobino-infrastructure"
version = "2.0.36"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
base64 = "0.22"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
url = "2"
hound.workspace = true
ring.workspace = true
lingua = { version = "1.8.0", default-features = false, features = [
    "bulgarian", "croatian", "czech", "danish", "dutch", "english", "estonian",
    "finnish", "french", "german", "greek", "hindi", "hungarian", "italian",
    "latvian", "lithuanian", "malay", "persian", "polish", "portuguese",
    "romanian", "slovak", "slovene", "spanish", "swahili", "swedish", "russian",
    "ukrainian",
] }
tempfile = "3.13"
sbobino-domain = { path = "../domain" }
sbobino-application = { path = "../application" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
regex = "1"
tracing-subscriber.workspace = true
